name: cleanup-receipt

x-postgres-image: &postgres-image postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0

services:
  bootstrap:
    image: *postgres-image
    pull_policy: never
    profiles: [tools]
    network_mode: none
    entrypoint: [bash, /bootstrap.sh]
    volumes:
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
      - admin-secrets:/run/admin
      - api-secrets:/run/api
      - database-tls:/run/tls

  db:
    image: *postgres-image
    pull_policy: never
    environment:
      POSTGRES_DB: proof
      POSTGRES_PASSWORD_FILE: /run/admin/password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/tls/server.crt
      - -c
      - ssl_key_file=/run/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/proof/pg_hba.conf
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - database:/var/lib/postgresql/data
      - admin-secrets:/run/admin:ro
      - database-tls:/run/tls:ro
      - ./infra/postgres/pg_hba.conf:/etc/proof/pg_hba.conf:ro
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/10-proof.sh:ro
    networks: [metadata]
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d proof']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  tools:
    image: *postgres-image
    user: '999:999'
    pull_policy: never
    profiles: [tools]
    entrypoint: []
    command: [/app/dbtool, status]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.build:/app:ro
      - admin-secrets:/run/admin:ro
      - api-secrets:/run/api:ro
    networks: [metadata]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

networks:
  metadata:
    internal: true

volumes:
  database:
  admin-secrets:
  api-secrets:
  database-tls:
