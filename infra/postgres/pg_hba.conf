# Unix socket administration is confined to the database container.
local   all   all                         peer
# Explicitly reject plaintext TCP, including clients that try TLS fallback.
hostnossl all  all   0.0.0.0/0             reject
hostnossl all  all   ::/0                  reject
hostssl proof proof_api 0.0.0.0/0         scram-sha-256
hostssl proof proof_api ::/0              scram-sha-256
# Administrative tools create throwaway test databases. No host ports are published.
hostssl all postgres 0.0.0.0/0            scram-sha-256
hostssl all postgres ::/0                 scram-sha-256
# Reserved test DB prefix; the role still needs CONNECT privileges in each DB.
hostssl /^proofcheck_.*$ proof_api 0.0.0.0/0 scram-sha-256
hostssl /^proofcheck_.*$ proof_api ::/0      scram-sha-256
